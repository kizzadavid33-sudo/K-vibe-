name: Build K-vibe Native APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare K-vibe web assets
        run: |
          rm -rf android-native/app/src/main/assets /tmp/kvibe
          mkdir -p android-native/app/src/main/assets /tmp/kvibe
          unzip -q K-vibe-FINAL-MASTER-WITH-MUSIC.zip -d /tmp/kvibe
          cp -a /tmp/kvibe/. android-native/app/src/main/assets/
          test -f android-native/app/src/main/assets/index.html
          if find android-native/app/src/main/assets -type f | grep -Eiq 'mirror|husie'; then
            echo "Mirror Gram/Husie content detected in K-vibe build assets"
            exit 1
          fi
          mkdir -p android-native/app/src/main/res/drawable-nodpi
          base64 -d android-native/app/src/main/assets/kvibe-logo.b64 > android-native/app/src/main/res/drawable-nodpi/kvibe_icon.jpg
          file android-native/app/src/main/res/drawable-nodpi/kvibe_icon.jpg
          test -s android-native/app/src/main/res/drawable-nodpi/kvibe_icon.jpg
      - name: Build debug APK
        working-directory: android-native
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: K-vibe-Android-APK-v1.0.0
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
